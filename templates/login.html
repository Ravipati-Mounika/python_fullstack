<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='css/static/style.css')}}">
    <title>Login Page</title>
</head>

<body>
    <header>
        <h1>Login</h1>
        <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/courses">Courses</a>
      <a href="/trainers">Trainers</a>
      {% if session.get('user_email')%}
      <a href="/logout">Logout</a>
      {% else %}
      <a href="/register">Register</a>
      <a href="/login">Login</a>
      {% endif%}
      <a href="/contact">Contact</a>
    </nav>
    </header>

    <main>
        <h2>Student Login</h2>
        <form id="LoginForm" method="POST">
            <label>Email</label><br>
            <input type="email" placeholder="Enter your Email" id="loginemail"><br>
            <label>Password</label><br>
            <input type="password" placeholder="Enter Your Password" id="loginpassword"> <br>
            <input type="submit" value="Login">
            <button type="submit" value="Login">Login</button>
        </form>
    </main>
    <footer>

        <hr>

        <p>&copy; 2026 NRIIT Learning Management System</p>

        <p>Email: info@nriit.edu</p>

        <p>Phone: +91 9876543210</p>

        <p>Follow Us:</p>

        <a href="#">Facebook</a> |

        <a href="#">Instagram</a> |

        <a href="#">LinkedIn</a>

    </footer>
     <script src="{{url_for('static',filename='js/static/script.js')}}"></script>
</body>

</html>
